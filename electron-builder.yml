# electron-builder configuration for Windows.
#
# Two output shapes are produced:
#   `npm run pack`  → release/win-unpacked/JJ Music.exe  (portable, no install)
#   `npm run dist`  → release/JJ Music-<version>-x64.exe (NSIS installer)
#
# ## Why `asarUnpack` is required
#
# The 音源 engine starts each source in a forked child process. Electron can read
# files from inside `app.asar` transparently for the *main* process, but
# `child_process.fork()` cannot execute a script that lives in an archive — it
# needs a real path on disk.
#
# Without the unpack rule below, the packaged app launches normally and then
# silently shows "0 online platforms": every `fork()` fails, the sources never
# start, and nothing surfaces an error. That failure was observed and is the
# reason this rule exists. Do not remove it without re-testing the packaged
# build's source list.

appId: com.jjmusic.desktop
productName: JJ Music
copyright: Copyright © 2026 JJ Music contributors

directories:
  output: release
  buildResources: build

files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'
  # Test bundles live under out/test and are never part of the shipped app.
  # Shipping them would add weight and expose test scaffolding.
  - '!out/test/**/*'

# `music-metadata` and `iconv-lite` are pure JavaScript, so no native rebuild
# step is required and the packaged app stays portable across machines.
asar: true

# Keep the forked host script outside the archive so `fork()` can load it, and keep
# the packages it imports reachable from that on-disk location.
#
# The second rule is not redundant with the first. Inside the archive, Electron's
# patched `fs` lets the *main* process `require('iconv-lite')` normally, but the
# fork runs with `ELECTRON_RUN_AS_NODE` — plain Node, no asar support — so bare
# specifiers resolve by walking up from the host file's real path:
# `resources/app.asar.unpacked/out/main/` … `resources/app.asar.unpacked/`. Nothing
# along that chain holds a `node_modules`, because the dependency is still packed
# inside `app.asar`. The child then dies during its own import, before any user
# script runs, and every source reports 「音源进程退出（退出码 1）」.
#
# Measured on 2026-09-19 against the published 0.1.5 Portable zip: no source would
# start until `iconv-lite` (and its own dependency) was unpacked beside the host,
# after which all of them advertised their platforms. A `release/win-unpacked` run
# from inside the repository hides this completely, because the repo's own
# `node_modules` is an ancestor directory — and so does CI, for the same reason.
asarUnpack:
  - out/main/source-host.js
  - node_modules/iconv-lite/**
  - node_modules/safer-buffer/**

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.ico
  # Hyphenated, not `${productName}`: the product name contains a space, and
  # GitHub normalises spaces in release-asset filenames to dots on upload
  # (`JJ Music-0.1.2-...` became `JJ.Music-0.1.2-...`), which silently broke
  # every download link in the README. The 0.1.1 assets were named with
  # hyphens, so this also restores the established convention.
  artifactName: JJ-Music-${version}-Portable-${arch}.${ext}

# Electron's own defaults are the *development* defaults, and a shipped binary
# that keeps them hands a debugger to anyone who can launch it with a flag.
# electron-builder flips these after packaging and before signing, so the code
# signature (when there is one) covers the flipped binary.
#
# Measured on the 0.1.7 build before this block existed:
#   `JJ Music.exe --inspect=9444`  → `GET /json/list` answered with a live Node
#                                     inspector on the packaged exe.
# Every fuse below is a deliberate decision, not a default:
electronFuses:
  # MUST stay true. Two things depend on `ELECTRON_RUN_AS_NODE`:
  # `sources/source-engine.ts` starts the 音源 host with `fork()`, and
  # `sources/restricted-launch.ts` sets that variable itself for the restricted
  # launcher. @electron/fuses documents the consequence directly: disabling it
  # "also breaks `process.fork()` in the main process". Turning this off would
  # ship an app with zero usable 音源.
  runAsNode: true

  # Off: nothing in the app reads `NODE_OPTIONS` or `NODE_EXTRA_CA_CERTS`, and
  # honouring them lets a launcher inject `--require` (i.e. arbitrary code) into
  # the main process.
  enableNodeOptionsEnvironmentVariable: false

  # Off: `--inspect` / `--inspect-brk` are development flags. This is the fuse
  # that closes the live-inspector measurement quoted above. `SIGUSR1` no longer
  # opens the V8 inspector either.
  enableNodeCliInspectArguments: false

  # On: Electron verifies the embedded SHA-256 of `app.asar` before loading it,
  # so a replaced archive is refused instead of executed. Supported on Windows
  # from Electron 30 (this build is 38); requires `asar` to be enabled and
  # `disableAsarIntegrity` to be off, both of which hold in this file.
  # electron-builder writes the INTEGRITY resource itself — see
  # `node_modules/app-builder-lib/out/electron/electronWin.js`.
  enableEmbeddedAsarIntegrityValidation: true

  # On: the app is looked up in `app.asar` only, with no fallback to an
  # `app/` directory or `default_app.asar`. Together with the fuse above, an
  # attacker cannot side-load code by dropping an unarchived `app/` next to the
  # exe. `asarUnpack` is unaffected: it changes where *files* live, not where
  # the app is loaded from.
  onlyLoadAppFromAsar: true

# Not set, and why, so the next reader does not have to re-derive it:
#
#   grantFileProtocolExtraPrivileges — left at Electron's default (enabled).
#     The advice to disable it applies to apps that never load content from
#     `file://`, and this one does: in a packaged build both windows load their
#     HTML with `loadFile()` (`src/main/index.ts`, `src/main/desktop-lyrics.ts`).
#     The `jjmedia://` protocol serves *media*, not the app shell.
#   enableCookieEncryption — left alone. It is a one-way migration of the
#     Chromium cookie store, and nothing in this app logs in anywhere.
#   resetAdHocDarwinSignature — macOS-only, and this build is Windows-only.

nsis:
  artifactName: JJ-Music-${version}-Setup-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: JJ Music
  # The app writes its library index and settings to %APPDATA%\jj-music, so
  # uninstalling should not silently discard a user's scanned library.
  deleteAppDataOnUninstall: false
