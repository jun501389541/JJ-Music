<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>JJ Music</title>
    <!--
      The renderer loads no remote *code*. Remote cover art and streamed audio
      are the exceptions that make `img-src`/`media-src` wide: search results
      point straight at platform CDNs, and the alternative is proxying every
      thumbnail through the main process. Everything else is bundled, so the
      directives that do NOT fall back to `default-src` are pinned here:
      `base-uri` (a hijacked <base> rewrites every relative URL on the page),
      `form-action` (this window has no forms) and `object-src`.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http: jjmedia:; media-src 'self' blob: https: http: jjmedia:; font-src 'self' data:; connect-src 'self' https: http: ws:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
