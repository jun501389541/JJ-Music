<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      This window used to have no policy at all while its sibling entry had one.
      It runs a preload bridge (`window.desktopLyric`) and paints text handed to
      it by the main window, so the tight set is free: nothing here loads or
      fetches anything remote, and the only dynamic styling is custom properties
      set through CSSOM (`--lyric-size`, `--lyric-accent`).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>JJ Music 桌面歌词</title>
  </head>
  <body>
    <div id="lyric" class="lyric">
      <!--
        The live region sits on the current line, not on the container. As a
        container live region it announced on every rewrite, so a screen reader
        read the translation too and re-read the whole block each lyric tick.
      -->
      <div class="lyric__line" id="line" aria-live="polite"></div>
      <div class="lyric__sub" id="sub"></div>
    </div>
    <script type="module" src="/src/desktop-lyrics/main.ts"></script>
  </body>
</html>
