name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# This workflow only compiles and tests; it never publishes. Without an explicit
# grant the token inherits whatever default the repo/org is configured with, and
# that default has historically been writable.
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, build, headless tests
    # Windows, not ubuntu: this is a Windows-only app and several suites assume
    # Windows paths, GBK decoding and the `runas` launcher. A Linux green would
    # not describe the artifact that ships.
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      # No suite imports `electron` — `src/main/index.ts` is the only module
      # that does, and it is not a test bundle entry point — so the ~100 MB
      # binary download is dead weight. Skipping it also keeps CI independent
      # of the npmmirror entry in .npmrc.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify
        run: npm run verify

      # `npm run test:e2e` is deliberately absent: it drives a real window, a
      # real audio device and the developer's own music folder, so it cannot be
      # a gate. It is re-run by hand before each release; see docs/.

  # What the `verify` job above cannot catch: it runs from `out/`, with the
  # developer's own data, on a machine that already has the forked host unpacked
  # and the file system warm. A downloaded build on another machine fails
  # differently -- asar unpacking, the fork's cwd and module resolution, a source
  # that has to pass validation on a fresh import. This job packages, then drives
  # the packaged exe with an empty profile, so that class of failure is a build
  # failure rather than a user report.
  packaged-sources:
    name: Packaged build can start 音源
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      # Unlike `verify`, this job must have the real Electron binary: packaging
      # assembles it. Hence no ELECTRON_SKIP_BINARY_DOWNLOAD here, and no
      # dependency on the mirror that used to sit in .npmrc.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the unpacked distribution
        run: npm run pack

      - name: Check the artifact itself
        run: node tools/probe/verify-package.mjs

      - name: Import, enable and play through the packaged build
        run: node tools/probe/clean-profile-sources.mjs --synthetic

      # After the functional checks, because it is the slower target and its
      # failure means "the release cannot be published", not "the app is broken".
      #
      # Nothing here used to build what a user actually downloads: `--dir` emits
      # `win-unpacked`, while the release page carries the NSIS Setup and the
      # Portable ZIP. A broken `nsis`/`zip` configuration, or a sums file written
      # for files that do not exist, was therefore invisible until a person
      # followed the README link.
      - name: Build the shipped installer and ZIP
        run: npm run dist

      - name: Checksums match the files they name
        shell: bash
        run: |
          cd release
          sha256sum -c SHA256SUMS.txt
          # Listing a stale file from an earlier release would pass the check
          # above, so pin the set to the version being built.
          version=$(node -p "require('../package.json').version")
          count=$(grep -c . SHA256SUMS.txt)
          extra=$(grep -vc "JJ-Music-${version}-" SHA256SUMS.txt || true)
          echo "SHA256SUMS.txt: ${count} line(s), ${extra} not matching ${version}"
          test "${extra}" = "0" && test "${count}" = "2"
