# electron-builder configuration for Windows.
#
# Two output shapes are produced:
#   `npm run pack`  → release/win-unpacked/JJ Music.exe  (portable, no install)
#   `npm run dist`  → release/JJ Music-<version>-x64.exe (NSIS installer)
#
# ## Why `asarUnpack` is required
#
# The 音源 engine starts each source in a forked child process. Electron can read
# files from inside `app.asar` transparently for the *main* process, but
# `child_process.fork()` cannot execute a script that lives in an archive — it
# needs a real path on disk.
#
# Without the unpack rule below, the packaged app launches normally and then
# silently shows "0 online platforms": every `fork()` fails, the sources never
# start, and nothing surfaces an error. That failure was observed and is the
# reason this rule exists. Do not remove it without re-testing the packaged
# build's source list.

appId: com.jjmusic.desktop
productName: JJ Music
copyright: Copyright © 2026 JJ Music contributors

directories:
  output: release
  buildResources: build

files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'
  # Test bundles live under out/test and are never part of the shipped app.
  # Shipping them would add weight and expose test scaffolding.
  - '!out/test/**/*'

# `music-metadata` and `iconv-lite` are pure JavaScript, so no native rebuild
# step is required and the packaged app stays portable across machines.
asar: true

# Keep the forked host script outside the archive so `fork()` can load it, and keep
# the packages it imports reachable from that on-disk location.
#
# The second rule is not redundant with the first. Inside the archive, Electron's
# patched `fs` lets the *main* process `require('iconv-lite')` normally, but the
# fork runs with `ELECTRON_RUN_AS_NODE` — plain Node, no asar support — so bare
# specifiers resolve by walking up from the host file's real path:
# `resources/app.asar.unpacked/out/main/` … `resources/app.asar.unpacked/`. Nothing
# along that chain holds a `node_modules`, because the dependency is still packed
# inside `app.asar`. The child then dies during its own import, before any user
# script runs, and every source reports 「音源进程退出（退出码 1）」.
#
# Measured on 2026-09-19 against the published 0.1.5 Portable zip: no source would
# start until `iconv-lite` (and its own dependency) was unpacked beside the host,
# after which all of them advertised their platforms. A `release/win-unpacked` run
# from inside the repository hides this completely, because the repo's own
# `node_modules` is an ancestor directory — and so does CI, for the same reason.
asarUnpack:
  - out/main/source-host.js
  - node_modules/iconv-lite/**
  - node_modules/safer-buffer/**

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.ico
  # Hyphenated, not `${productName}`: the product name contains a space, and
  # GitHub normalises spaces in release-asset filenames to dots on upload
  # (`JJ Music-0.1.2-...` became `JJ.Music-0.1.2-...`), which silently broke
  # every download link in the README. The 0.1.1 assets were named with
  # hyphens, so this also restores the established convention.
  artifactName: JJ-Music-${version}-Portable-${arch}.${ext}

nsis:
  artifactName: JJ-Music-${version}-Setup-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: JJ Music
  # The app writes its library index and settings to %APPDATA%\jj-music, so
  # uninstalling should not silently discard a user's scanned library.
  deleteAppDataOnUninstall: false
