name: OR8 Official Packaged Updater Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: or8-published-updater-${{ github.ref }}
  cancel-in-progress: false

jobs:
  published-updater:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Official old app check, download, install and restart
        id: updater
        shell: pwsh
        run: ./tools/probe/or8-ci-updater.ps1
      - name: Retain published updater evidence
        if: always() && steps.updater.outputs.report-dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: or8-official-updater-${{ github.run_id }}
          path: |
            ${{ steps.updater.outputs.report-dir }}/*report.json
            ${{ steps.updater.outputs.report-dir }}/*.log
            ${{ steps.updater.outputs.report-dir }}/*.png
            ${{ steps.updater.outputs.report-dir }}/owner.json
          if-no-files-found: error
          retention-days: 14
